name: Core115 Validated 250 Maintenance

on:
  workflow_dispatch:
  push:
    branches:
      - maintenance/core115-validated250-stable
      - feature/anytls-oix-snell
      - upgrade/sing-box-1.15.0-alpha.12
    tags:
      - core115-validated250-maintenance-candidate-*

permissions:
  contents: read

# Runtime verification rejects ignored files too; imports must not dirty checkout.
env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  native:
    name: Native AAR and protocol gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false
      - name: Verify exact runtime checkout before private input
        shell: bash
        run: |
          set -euo pipefail
          test ! -e core115-source/sing-box/component/oixdnsauth/private_seed_generated.go
          python buildScript/lib/core/verify_runtime_clean.py
      - name: Prepare private Oix DNS-Auth build input
        id: oix-input
        shell: bash
        env:
          OIX_DNS_AUTH_SEED: ${{ secrets.OIX_DNS_AUTH_SEED }}
        run: python scripts/prepare_oix_dns_auth.py
      - name: Pin and build native source
        shell: bash
        run: |
          set -euo pipefail
          test -f core115-source/libcore/go.mod
          git clone --filter=blob:none https://github.com/MatsuriDayo/gomobile.git "$RUNNER_TEMP/gomobile"
          git -C "$RUNNER_TEMP/gomobile" checkout --detach 17d6af34f6bd6d7e1e428e0c652c8b54a46bda4f
          test "$(git -C "$RUNNER_TEMP/gomobile" rev-parse HEAD)" = 17d6af34f6bd6d7e1e428e0c652c8b54a46bda4f
          export GOMOBILE_SOURCE="$RUNNER_TEMP/gomobile"
          (cd core115-source/libcore && GOMOBILE_SOURCE="$GOMOBILE_SOURCE" bash ./init.sh && bash ./build.sh)
          test -s app/libs/libcore.aar
          rm -f core115-source/sing-box/component/oixdnsauth/private_seed_generated.go
          # Remove exact native build outputs, never exempt source directories.
          rm -rf core115-source/libcore/.build
          rm -f core115-source/libcore/libcore.aar
          printf 'GOMOBILE_SOURCE=%s' "$GOMOBILE_SOURCE" >> "$GITHUB_ENV"
      - name: Verify exact runtime checkout after private build
        shell: bash
        run: |
          set -euo pipefail
          test ! -e core115-source/sing-box/component/oixdnsauth/private_seed_generated.go
          python buildScript/lib/core/verify_runtime_clean.py
      - name: Create and verify secret runtime provenance
        shell: bash
        env:
          OIX_DNS_AUTH_SEED: ${{ secrets.OIX_DNS_AUTH_SEED }}
          OIX_SEED_FINGERPRINT: ${{ steps.oix-input.outputs.fingerprint }}
        run: |
          set -euo pipefail
          python scripts/test_prepare_oix_dns_auth.py
          python scripts/test_verify_oix_native.py
          python buildScript/lib/core/test_verify_runtime_provenance.py
          python buildScript/lib/core/verify_runtime_provenance.py \
            --create \
            --aar app/libs/libcore.aar \
            --runtime-attestation "$RUNNER_TEMP/runtime-attestation.json" \
            --seed-fingerprint "$OIX_SEED_FINGERPRINT"
          python buildScript/lib/core/verify_runtime_provenance.py \
            --aar app/libs/libcore.aar \
            --runtime-attestation "$RUNNER_TEMP/runtime-attestation.json" \
            --expected-seed-fingerprint "$OIX_SEED_FINGERPRINT" \
            --verify-oix
          (cd core115-source/libcore && go test -tags with_utls ../sing-box/component/oixdnsauth ../sing-box/protocol/snell github.com/sagernet/sing-snell/...)
      - name: Native Pure and geo gates
        shell: bash
        run: |
          set -euo pipefail
          python buildScript/lib/core/verify_provenance.py --source-only
          (cd core115-source/libcore && go test -tags='with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api' ./boxapi ./androidmonitor ./latencyaudit)
          (cd core115-source/libcore && go test -tags='with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api' . -run 'TestIPQuality|TestBoxInstanceQueryIPQuality|TestNormalizeSpeedTestStreams|TestRaceSpeedBackends|TestRunTransfer|TestUpload' -count=1)
          unzip -l app/libs/libcore.aar | tee "$RUNNER_TEMP/aar-files.txt"
          grep -q 'jni/arm64-v8a/libgojni.so' "$RUNNER_TEMP/aar-files.txt"
          ! grep -Eq 'jni/(armeabi-v7a|x86|x86_64)/' "$RUNNER_TEMP/aar-files.txt"
      - name: Stage flat runtime native bundle outside checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-native-bundle"
          cp app/libs/libcore.aar "$RUNNER_TEMP/runtime-native-bundle/libcore.aar"
          cp "$RUNNER_TEMP/runtime-attestation.json" "$RUNNER_TEMP/runtime-native-bundle/runtime-attestation.json"
      - uses: actions/upload-artifact@v7
        with:
          name: libcore-runtime-provenance
          path: ${{ runner.temp }}/runtime-native-bundle
          if-no-files-found: error
          retention-days: 3

  android:
    name: Android tests and unsigned arm64 release
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v5
        with:
          name: libcore-runtime-provenance
          path: ${{ runner.temp }}/runtime-provenance
      - name: Install verified runtime AAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          cp "$RUNNER_TEMP/runtime-provenance/libcore.aar" app/libs/libcore.aar
          cp "$RUNNER_TEMP/runtime-provenance/runtime-attestation.json" "$RUNNER_TEMP/runtime-attestation.json"
          test -f "$RUNNER_TEMP/runtime-attestation.json"
          python buildScript/lib/core/verify_runtime_provenance.py \
            --aar app/libs/libcore.aar \
            --runtime-attestation "$RUNNER_TEMP/runtime-attestation.json"
      - name: Gradle tests and release build
        shell: bash
        env:
          BUILD_PLUGIN: none
          HEV_SRC: ${{ runner.temp }}/hev-socks5-tunnel
        run: |
          set -euo pipefail
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties

          export GRADLE_OPTS="${GRADLE_OPTS:-} -Dhttps.protocols=TLSv1.2 -Djava.net.preferIPv4Stack=true"
          bash buildScript/init/action/gradle.sh
          tests_ok=false
          for attempt in 1 2 3; do
            if bash ./gradlew --no-daemon --refresh-dependencies app:testOssDebugUnitTest app:testOssReleaseUnitTest --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle-unit-tests.log"; then
              tests_ok=true
              break
            fi
            test "$attempt" -lt 3
            sleep 15
          done
          test "$tests_ok" = true
          bash ./gradlew --no-daemon app:assembleOssRelease --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle-release-build.log"
      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-diagnostics
          path: |
            ${{ runner.temp }}/gradle-unit-tests.log
            ${{ runner.temp }}/gradle-release-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify target APK against runtime provenance
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/oss/release -type f -name '*arm64-v8a*.apk')
          test "${#apks[@]}" -eq 1
          APK="${apks[0]}"
          cp "$APK" "$RUNNER_TEMP/runtime-release.apk"
          APK="$RUNNER_TEMP/runtime-release.apk"
          # These are generated outputs only, not allowlisted packaging inputs.
          rm -rf .gradle .kotlin app/build buildSrc/build buildSrc/.gradle
          rm -rf .hev-build app/src/main/jniLibs
          rm -rf app/src/main/assets/sing-box
          rm -f local.properties
          python buildScript/lib/core/verify_runtime_provenance.py \
            --aar app/libs/libcore.aar \
            --runtime-attestation "$RUNNER_TEMP/runtime-attestation.json" \
            --apk "$APK" \
            --aapt "${ANDROID_HOME}/build-tools/35.0.0/aapt"
          for asset in geoip.db geosite.db; do unzip -l "$APK" | grep -q "$asset"; done
          if "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify "$APK"; then
            echo 'APK unexpectedly signed' >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/runtime-output"
          cp "$APK" "$RUNNER_TEMP/runtime-output/NekoBoxYF-core115-validated250-arm64-release-unsigned.apk"
          cp "$RUNNER_TEMP/runtime-attestation.json" "$RUNNER_TEMP/runtime-output/runtime-attestation.json"
          (cd "$RUNNER_TEMP/runtime-output" && sha256sum NekoBoxYF-core115-validated250-arm64-release-unsigned.apk > NekoBoxYF-core115-validated250-arm64-release-unsigned.apk.sha256)
          python buildScript/lib/core/verify_runtime_clean.py
          python tools/verify_maintenance_ci.py .
      - uses: actions/upload-artifact@v7
        with:
          name: NekoBoxYF-core115-validated250-arm64-unsigned
          path: ${{ runner.temp }}/runtime-output
          if-no-files-found: error
          retention-days: 30
