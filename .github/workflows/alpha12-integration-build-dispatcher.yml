name: Alpha12 Integration Build Dispatcher

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Alpha12 integration branch to build
        required: true
        default: upgrade/sing-box-1.15.0-alpha.12
        type: string

permissions:
  contents: read

concurrency:
  group: alpha12-integration-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Native AAR and protocol gates
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Validate and resolve Alpha12 branch
        id: resolve
        uses: actions/github-script@v8
        env:
          TARGET_REF: ${{ inputs.ref }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const targetRef = process.env.TARGET_REF;
            const baseRef = 'upgrade/sing-box-1.15.0-alpha.12';
            if (targetRef !== baseRef && !targetRef.startsWith(`${baseRef}-`)) {
              core.setFailed('Ref is outside the Alpha12 branch allowlist');
              return;
            }
            const response = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${targetRef}`,
            });
            if (response.data.ref !== `refs/heads/${targetRef}`) {
              core.setFailed('GitHub returned a different ref');
              return;
            }
            if (response.data.object.type !== 'commit') {
              core.setFailed('Allowed ref does not resolve directly to a commit');
              return;
            }
            const sha = response.data.object.sha;
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed('Resolved commit SHA is invalid');
              return;
            }
            core.setOutput('sha', sha);
            core.info(`Resolved ${targetRef} to ${sha}`);
      - name: Checkout resolved Alpha12 commit
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive
      - name: Verify resolved checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false
      - name: Prepare private Oix DNS-Auth build input
        shell: bash
        env:
          OIX_DNS_AUTH_SEED: ${{ secrets.OIX_DNS_AUTH_SEED }}
        run: python scripts/prepare_oix_dns_auth.py
      - name: Pin and build native source
        shell: bash
        run: |
          set -euo pipefail
          test -f core115-source/libcore/go.mod
          git clone --filter=blob:none https://github.com/MatsuriDayo/gomobile.git core115-source/gomobile
          git -C core115-source/gomobile checkout --detach 17d6af34f6bd6d7e1e428e0c652c8b54a46bda4f
          test "$(git -C core115-source/gomobile rev-parse HEAD)" = 17d6af34f6bd6d7e1e428e0c652c8b54a46bda4f
          chmod +x core115-source/libcore/init.sh core115-source/libcore/build.sh
          (cd core115-source/libcore && ./init.sh && ./build.sh)
          test -s app/libs/libcore.aar
      - name: Verify private Oix input in every native artifact
        shell: bash
        env:
          OIX_DNS_AUTH_SEED: ${{ secrets.OIX_DNS_AUTH_SEED }}
        run: |
          python scripts/test_verify_oix_native.py
          python scripts/verify_oix_native.py --aar app/libs/libcore.aar
          (cd core115-source/libcore && go test -tags with_utls ../sing-box/component/oixdnsauth ../sing-box/protocol/snell github.com/sagernet/sing-snell/...)
      - name: Native provenance Pure and geo gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          from buildScript.lib.core.verify_native import canonical_zip_digest
          aar = Path('app/libs/libcore.aar')
          data = aar.read_bytes()
          with zipfile.ZipFile(aar) as archive:
              print('CI_AAR_SHA256=' + hashlib.sha256(data).hexdigest())
              print('CI_AAR_CONTENT_SHA256=' + canonical_zip_digest(data))
              print('CI_CLASSES_JAR_SHA256=' + hashlib.sha256(archive.read('classes.jar')).hexdigest())
              print('CI_ARM64_SO_SHA256=' + hashlib.sha256(archive.read('jni/arm64-v8a/libgojni.so')).hexdigest())
          PY
          python buildScript/lib/core/verify_native.py --aar app/libs/libcore.aar
          # verify_native.py calls verify_provenance.py for schema-2 local snapshots.
          (cd core115-source/libcore && go test -tags='with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api' ./boxapi ./androidmonitor ./latencyaudit)
          (cd core115-source/libcore && go test -tags='with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api' . -run 'TestIPQuality|TestBoxInstanceQueryIPQuality|TestNormalizeSpeedTestStreams|TestRaceSpeedBackends|TestRunTransfer|TestUpload' -count=1)
          unzip -l app/libs/libcore.aar | tee aar-files.txt
          grep -q 'jni/arm64-v8a/libgojni.so' aar-files.txt
          ! grep -Eq 'jni/(armeabi-v7a|x86|x86_64)/' aar-files.txt
      - name: Create runtime attestation
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.ref }}
          SOURCE_SHA: ${{ steps.resolve.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import zipfile
          from pathlib import Path
          from buildScript.lib.core.verify_native import canonical_zip_digest

          aar = Path("app/libs/libcore.aar")
          data = aar.read_bytes()
          with zipfile.ZipFile(aar) as archive:
              attestation = {
                  "schema": 1,
                  "repository": os.environ["REPOSITORY"],
                  "source_ref": os.environ["SOURCE_REF"],
                  "source_sha": os.environ["SOURCE_SHA"],
                  "workflow_run_id": int(os.environ["RUN_ID"]),
                  "workflow_run_attempt": int(os.environ["RUN_ATTEMPT"]),
                  "aar_sha256": hashlib.sha256(data).hexdigest(),
                  "aar_content_sha256": canonical_zip_digest(data),
                  "classes_jar_sha256": hashlib.sha256(archive.read("classes.jar")).hexdigest(),
                  "arm64_libgojni_sha256": hashlib.sha256(
                      archive.read("jni/arm64-v8a/libgojni.so")
                  ).hexdigest(),
              }
          Path("out/alpha12-runtime-attestation.json").write_text(
              json.dumps(attestation, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          python3 -m json.tool out/alpha12-runtime-attestation.json >/dev/null
      - name: Upload native AAR
        uses: actions/upload-artifact@v7
        with:
          name: alpha12-libcore-aar-${{ steps.resolve.outputs.sha }}
          path: app/libs/libcore.aar
          if-no-files-found: error
          retention-days: 3
      - name: Upload runtime attestation
        uses: actions/upload-artifact@v7
        with:
          name: alpha12-runtime-attestation-${{ steps.resolve.outputs.sha }}
          path: out/alpha12-runtime-attestation.json
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android tests and unsigned arm64 release
    needs: native
    runs-on: ubuntu-latest
    steps:
      - name: Checkout resolved Alpha12 commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.native.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive
      - name: Verify resolved checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.native.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v5
        with:
          name: alpha12-libcore-aar-${{ needs.native.outputs.source_sha }}
          path: app/libs
      - name: Gradle tests and release build
        shell: bash
        env:
          BUILD_PLUGIN: none
        run: |
          set -euo pipefail
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          chmod +x ./run ./gradlew buildScript/init/action/gradle.sh
          export GRADLE_OPTS="${GRADLE_OPTS:-} -Dhttps.protocols=TLSv1.2 -Djava.net.preferIPv4Stack=true"
          ./run init action gradle
          tests_ok=false
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --refresh-dependencies app:testOssDebugUnitTest app:testOssReleaseUnitTest --stacktrace --console=plain 2>&1 | tee gradle-unit-tests.log; then
              tests_ok=true
              break
            fi
            test "$attempt" -lt 3
            sleep 15
          done
          test "$tests_ok" = true
          ./gradlew --no-daemon app:assembleOssRelease --stacktrace --console=plain 2>&1 | tee gradle-release-build.log
      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alpha12-gradle-diagnostics-${{ needs.native.outputs.source_sha }}
          path: |
            gradle-unit-tests.log
            gradle-release-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify target APK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/oss/release -type f -name '*arm64-v8a*.apk')
          test "${#apks[@]}" -eq 1
          APK="${apks[0]}"
          unzip -l "$APK" | tee apk-files.txt
          grep -q 'lib/arm64-v8a/libgojni.so' apk-files.txt
          ! grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/' apk-files.txt
          unzip -p "$APK" lib/arm64-v8a/libgojni.so > apk-libgojni.so
          unzip -p app/libs/libcore.aar jni/arm64-v8a/libgojni.so > aar-libgojni.so
          cmp apk-libgojni.so aar-libgojni.so
          for asset in geoip.db geosite.db; do unzip -l "$APK" | grep -q "$asset"; done
          if "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify "$APK"; then
            echo 'APK unexpectedly signed' >&2
            exit 1
          fi
          mkdir -p out
          cp "$APK" out/NekoBoxYF-core115-validated250-arm64-release-unsigned.apk
          (cd out && sha256sum NekoBoxYF-core115-validated250-arm64-release-unsigned.apk > NekoBoxYF-core115-validated250-arm64-release-unsigned.apk.sha256)
          python tools/verify_maintenance_ci.py .
      - name: Upload unsigned Alpha12 APK
        uses: actions/upload-artifact@v7
        with:
          name: NekoBoxYF-alpha12-arm64-unsigned-${{ needs.native.outputs.source_sha }}
          path: |
            out/NekoBoxYF-core115-validated250-arm64-release-unsigned.apk
            out/NekoBoxYF-core115-validated250-arm64-release-unsigned.apk.sha256
          if-no-files-found: error
          retention-days: 30
