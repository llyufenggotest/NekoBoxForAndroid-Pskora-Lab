name: Alpha12 Integration Build Dispatcher

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact Alpha12 integration branch to build
        required: true
        default: upgrade/sing-box-1.15.0-alpha.12
        type: string
      expected_sha:
        description: Exact 40-character commit SHA already pushed to the target branch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: alpha12-integration-${{ inputs.expected_sha }}
  cancel-in-progress: false

env:
  GOMOBILE_COMMIT: 17d6af34f6bd6d7e1e428e0c652c8b54a46bda4f

jobs:
  native:
    name: Native AAR and runtime provenance gates
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Initialize external native artifact paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "RUNTIME_PROVENANCE=$RUNNER_TEMP/runtime-attestation.json"
            echo "NATIVE_BUNDLE_ROOT=$RUNNER_TEMP/alpha12-native-bundle"
            echo "NATIVE_AAR_ARTIFACT=$RUNNER_TEMP/alpha12-native-bundle/libcore.aar"
            echo "NATIVE_RUNTIME_ARTIFACT=$RUNNER_TEMP/alpha12-native-bundle/runtime-attestation.json"
          } >> "$GITHUB_ENV"
      - name: Validate and resolve exact Alpha12 commit
        id: resolve
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          TARGET_REF: ${{ inputs.ref }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const targetRef = process.env.TARGET_REF;
            const expectedSha = process.env.EXPECTED_SHA;
            const allowedRef = 'upgrade/sing-box-1.15.0-alpha.12';
            if (targetRef !== allowedRef) {
              core.setFailed('Only the exact Alpha12 integration branch is allowed');
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(expectedSha)) {
              core.setFailed('expected_sha must be exactly 40 lowercase hexadecimal characters');
              return;
            }
            const response = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${targetRef}`,
            });
            if (response.data.ref !== `refs/heads/${allowedRef}`) {
              core.setFailed('GitHub returned a different ref');
              return;
            }
            if (response.data.object.type !== 'commit') {
              core.setFailed('Allowed ref does not resolve directly to a commit');
              return;
            }
            const sha = response.data.object.sha;
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed('Resolved commit SHA is invalid');
              return;
            }
            if (sha !== expectedSha) {
              core.setFailed(`Target branch SHA ${sha} does not match expected_sha ${expectedSha}`);
              return;
            }
            core.setOutput('sha', sha);
            core.info(`Resolved ${targetRef} to the caller-approved commit ${sha}`);
      - name: Checkout caller-approved Alpha12 commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false
          submodules: recursive
      # SECURITY: Target checkout scripts are trusted only after exact branch and SHA validation.
      # A caller must push the target branch first and supply its observed 40-hex commit SHA.
      - name: Verify resolved checkout and runtime verifier
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -f buildScript/lib/core/verify_runtime_provenance.py
          python buildScript/lib/core/verify_runtime_provenance.py --help >/dev/null
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5'
          cache: false
      - name: Prepare private Oix DNS-Auth build input
        id: oix-input
        shell: bash
        env:
          OIX_DNS_AUTH_SEED: ${{ secrets.OIX_DNS_AUTH_SEED }}
        run: python scripts/prepare_oix_dns_auth.py
      - name: Pin and build private native source
        shell: bash
        run: |
          set -euo pipefail
          test -f core115-source/libcore/go.mod
          rm -rf "$RUNNER_TEMP/gomobile"
          git clone --filter=blob:none https://github.com/MatsuriDayo/gomobile.git "$RUNNER_TEMP/gomobile"
          git -C "$RUNNER_TEMP/gomobile" checkout --detach "$GOMOBILE_COMMIT"
          test "$(git -C "$RUNNER_TEMP/gomobile" rev-parse HEAD)" = "$GOMOBILE_COMMIT"
          export GOMOBILE_SOURCE="$RUNNER_TEMP/gomobile"
          chmod +x core115-source/libcore/init.sh core115-source/libcore/build.sh
          (cd core115-source/libcore && GOMOBILE_SOURCE="$GOMOBILE_SOURCE" ./init.sh && ./build.sh)
          test -s app/libs/libcore.aar
          rm -f core115-source/sing-box/component/oixdnsauth/private_seed_generated.go
          test ! -e core115-source/sing-box/component/oixdnsauth/private_seed_generated.go
          printf 'GOMOBILE_SOURCE=%s\n' "$GOMOBILE_SOURCE" >> "$GITHUB_ENV"
      - name: Create and verify target runtime provenance
        shell: bash
        env:
          OIX_DNS_AUTH_SEED: ${{ secrets.OIX_DNS_AUTH_SEED }}
          OIX_SEED_FINGERPRINT: ${{ steps.oix-input.outputs.fingerprint }}
        run: |
          set -euo pipefail
          python scripts/test_prepare_oix_dns_auth.py
          python scripts/test_verify_oix_native.py
          python buildScript/lib/core/test_verify_runtime_provenance.py
          python buildScript/lib/core/verify_runtime_provenance.py \
            --create \
            --aar app/libs/libcore.aar \
            --runtime-attestation "$RUNTIME_PROVENANCE" \
            --seed-fingerprint "$OIX_SEED_FINGERPRINT"
          python buildScript/lib/core/verify_runtime_provenance.py \
            --aar app/libs/libcore.aar \
            --runtime-attestation "$RUNTIME_PROVENANCE" \
            --expected-seed-fingerprint "$OIX_SEED_FINGERPRINT" \
            --verify-oix
          (cd core115-source/libcore && go test -tags with_utls ../sing-box/component/oixdnsauth ../sing-box/protocol/snell github.com/sagernet/sing-snell/...)
      - name: Native Pure and geo gates
        shell: bash
        run: |
          set -euo pipefail
          python buildScript/lib/core/verify_provenance.py --source-only
          (cd core115-source/libcore && go test -tags='with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api' ./boxapi ./androidmonitor ./latencyaudit)
          (cd core115-source/libcore && go test -tags='with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api' . -run 'TestIPQuality|TestBoxInstanceQueryIPQuality|TestNormalizeSpeedTestStreams|TestRaceSpeedBackends|TestRunTransfer|TestUpload' -count=1)
          unzip -l app/libs/libcore.aar | tee aar-files.txt
          grep -q 'jni/arm64-v8a/libgojni.so' aar-files.txt
          ! grep -Eq 'jni/(armeabi-v7a|x86|x86_64)/' aar-files.txt
      - name: Stage native runtime provenance bundle outside checkout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$NATIVE_BUNDLE_ROOT"
          mkdir -p "$NATIVE_BUNDLE_ROOT"
          cp app/libs/libcore.aar "$NATIVE_AAR_ARTIFACT"
          cp "$RUNTIME_PROVENANCE" "$NATIVE_RUNTIME_ARTIFACT"
          test -s "$NATIVE_AAR_ARTIFACT"
          test -s "$NATIVE_RUNTIME_ARTIFACT"
      - name: Upload native AAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: alpha12-native-aar-${{ steps.resolve.outputs.sha }}
          path: ${{ env.NATIVE_AAR_ARTIFACT }}
          if-no-files-found: error
          retention-days: 3
      - name: Upload native runtime provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: alpha12-runtime-provenance-${{ steps.resolve.outputs.sha }}
          path: ${{ env.NATIVE_RUNTIME_ARTIFACT }}
          if-no-files-found: error
          retention-days: 3

  android:
    name: Android tests and verified unsigned arm64 release
    needs: native
    runs-on: ubuntu-latest
    steps:
      - name: Initialize external Android artifact paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "RUNTIME_PROVENANCE=$RUNNER_TEMP/runtime-attestation.json"
            echo "ANDROID_OUTPUT_ROOT=$RUNNER_TEMP/alpha12-android-output"
            echo "ANDROID_APK_ARTIFACT=$RUNNER_TEMP/alpha12-android-output/NekoBoxYF-core115-validated250-arm64-release-unsigned.apk"
            echo "ANDROID_SHA256_ARTIFACT=$RUNNER_TEMP/alpha12-android-output/NekoBoxYF-core115-validated250-arm64-release-unsigned.apk.sha256"
            echo "ANDROID_RUNTIME_ARTIFACT=$RUNNER_TEMP/alpha12-android-output/runtime-attestation.json"
          } >> "$GITHUB_ENV"
      - name: Checkout exact resolved Alpha12 commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.native.outputs.source_sha }}
          fetch-depth: 2
          persist-credentials: false
          submodules: recursive
      # SECURITY: Target checkout scripts are trusted only after exact branch and SHA validation.
      - name: Verify resolved checkout and runtime verifier
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.native.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -f buildScript/lib/core/verify_runtime_provenance.py
          python buildScript/lib/core/verify_runtime_provenance.py --help >/dev/null
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download native AAR
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: alpha12-native-aar-${{ needs.native.outputs.source_sha }}
          path: ${{ runner.temp }}/downloaded-native-aar
      - name: Download native runtime provenance
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: alpha12-runtime-provenance-${{ needs.native.outputs.source_sha }}
          path: ${{ runner.temp }}/downloaded-runtime-provenance
      - name: Install and verify runtime AAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          cp "$RUNNER_TEMP/downloaded-native-aar/libcore.aar" app/libs/libcore.aar
          cp "$RUNNER_TEMP/downloaded-runtime-provenance/runtime-attestation.json" "$RUNTIME_PROVENANCE"
          python buildScript/lib/core/verify_runtime_provenance.py \
            --aar app/libs/libcore.aar \
            --runtime-attestation "$RUNTIME_PROVENANCE"
      - name: Gradle tests and release build
        shell: bash
        env:
          BUILD_PLUGIN: none
        run: |
          set -euo pipefail
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          chmod +x ./run ./gradlew buildScript/init/action/gradle.sh
          export GRADLE_OPTS="${GRADLE_OPTS:-} -Dhttps.protocols=TLSv1.2 -Djava.net.preferIPv4Stack=true"
          ./run init action gradle
          tests_ok=false
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --refresh-dependencies app:testOssDebugUnitTest app:testOssReleaseUnitTest --stacktrace --console=plain 2>&1 | tee gradle-unit-tests.log; then
              tests_ok=true
              break
            fi
            test "$attempt" -lt 3
            sleep 15
          done
          test "$tests_ok" = true
          ./gradlew --no-daemon app:assembleOssRelease --stacktrace --console=plain 2>&1 | tee gradle-release-build.log
      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: alpha12-gradle-diagnostics-${{ needs.native.outputs.source_sha }}
          path: |
            gradle-unit-tests.log
            gradle-release-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify and stage target APK outside checkout
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/oss/release -type f -name '*arm64-v8a*.apk')
          test "${#apks[@]}" -eq 1
          APK="${apks[0]}"
          python buildScript/lib/core/verify_runtime_provenance.py \
            --aar app/libs/libcore.aar \
            --runtime-attestation "$RUNTIME_PROVENANCE" \
            --apk "$APK" \
            --aapt "${ANDROID_HOME}/build-tools/35.0.0/aapt"
          for asset in geoip.db geosite.db; do unzip -l "$APK" | grep -q "$asset"; done
          if "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify "$APK"; then
            echo 'APK unexpectedly signed' >&2
            exit 1
          fi
          rm -rf "$ANDROID_OUTPUT_ROOT"
          mkdir -p "$ANDROID_OUTPUT_ROOT"
          cp "$APK" "$ANDROID_APK_ARTIFACT"
          cp "$RUNTIME_PROVENANCE" "$ANDROID_RUNTIME_ARTIFACT"
          (cd "$ANDROID_OUTPUT_ROOT" && sha256sum "$(basename "$ANDROID_APK_ARTIFACT")" > "$(basename "$ANDROID_SHA256_ARTIFACT")")
          test -s "$ANDROID_APK_ARTIFACT"
          test -s "$ANDROID_SHA256_ARTIFACT"
          test -s "$ANDROID_RUNTIME_ARTIFACT"
          python tools/verify_maintenance_ci.py .
      - name: Upload verified unsigned Alpha12 APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: NekoBoxYF-alpha12-arm64-unsigned-${{ needs.native.outputs.source_sha }}
          path: ${{ env.ANDROID_APK_ARTIFACT }}
          if-no-files-found: error
          retention-days: 30
      - name: Upload verified unsigned Alpha12 APK checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: NekoBoxYF-alpha12-arm64-unsigned-sha256-${{ needs.native.outputs.source_sha }}
          path: ${{ env.ANDROID_SHA256_ARTIFACT }}
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android runtime provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: NekoBoxYF-alpha12-runtime-provenance-${{ needs.native.outputs.source_sha }}
          path: ${{ env.ANDROID_RUNTIME_ARTIFACT }}
          if-no-files-found: error
          retention-days: 30
